{{- if .Values.kafka.enabled }}
{{- $name := printf "%s-kafka" (include "flowforge.fullname" .) -}}
{{- $k := .Values.kafka -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "flowforge.labels" . | nindent 4 }}
    {{- include "flowforge.selector" (list . "kafka") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "flowforge.selector" (list . "kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flowforge.labels" . | nindent 8 }}
        {{- include "flowforge.selector" (list . "kafka") | nindent 8 }}
    spec:
      # The image turns every KAFKA_* variable into broker config, so injected service variables must stay out.
      enableServiceLinks: false
      securityContext:
        # The image runs as uid 1000; let it write to the volume.
        fsGroup: 1000
      containers:
        - name: kafka
          image: {{ $k.image }}
          ports:
            - name: kafka
              containerPort: 9092
          env:
            # Single node acting as both broker and KRaft controller.
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://{{ $name }}:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_NUM_PARTITIONS
              value: {{ $k.partitions | quote }}
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/logs
            - name: KAFKA_HEAP_OPTS
              value: -Xmx512m -Xms512m
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
          resources:
            {{- toYaml $k.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $k.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "flowforge.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "flowforge.selector" (list . "kafka") | nindent 4 }}
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
{{- end }}
