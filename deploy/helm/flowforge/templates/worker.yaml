{{- $name := printf "%s-worker" (include "flowforge.fullname" .) -}}
{{- $w := .Values.worker -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "flowforge.labels" . | nindent 4 }}
    {{- include "flowforge.selector" (list . "worker") | nindent 4 }}
spec:
  {{- if not $w.autoscaling.enabled }}
  replicas: {{ $w.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "flowforge.selector" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flowforge.labels" . | nindent 8 }}
        {{- include "flowforge.selector" (list . "worker") | nindent 8 }}
    spec:
      enableServiceLinks: false
      # Workers are stateless: a killed worker's uncommitted commands are redelivered to the others.
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: {{ include "flowforge.image" (list . $w.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: FLOWFORGE_KAFKA_BOOTSTRAP
              value: {{ include "flowforge.kafkaBootstrap" . | quote }}
            - name: SPRING_APPLICATION_JSON
              value: {{ dict
                  "flowforge" (dict
                    "kafka" (dict "partitions" .Values.kafka.partitions)
                    "worker" (dict "simulated-latency" $w.simulatedLatency "payments-url" (include "flowforge.paymentsUrl" .)))
                  "spring" (dict "kafka" (dict "listener" (dict "concurrency" $w.listenerConcurrency)))
                | toJson | quote }}
            {{- include "flowforge.tracingEnv" . | nindent 12 }}
            {{- with $w.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
{{- if $w.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "flowforge.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $w.autoscaling.minReplicas }}
  maxReplicas: {{ $w.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $w.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
