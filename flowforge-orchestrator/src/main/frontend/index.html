<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FlowForge — a durable workflow engine, live." />
    <title>FlowForge</title>
    <script>
      // Apply the saved theme before the first paint, so the page never flashes the wrong one.
      try {
        if (localStorage.getItem('ff-theme') === 'light') document.documentElement.classList.remove('dark');
      } catch (e) { /* storage unavailable */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
