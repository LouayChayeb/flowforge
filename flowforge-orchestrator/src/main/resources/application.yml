spring:
  application:
    name: flowforge-orchestrator
  datasource:
    url: ${FLOWFORGE_DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${FLOWFORGE_DB_USER:flowforge}
    password: ${FLOWFORGE_DB_PASSWORD:flowforge}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
  task:
    scheduling:
      pool:
        # One thread each for dispatching, outbox publishing and lease recovery.
        size: 3
  kafka:
    bootstrap-servers: ${FLOWFORGE_KAFKA_BOOTSTRAP:localhost:9092}
    # Shows up as the consumer's identity in Kafka (and in the dashboard): pod name on Kubernetes, host locally.
    client-id: flowforge-orchestrator-${HOSTNAME:${COMPUTERNAME:local}}-${server.port}
    consumer:
      group-id: flowforge-orchestrator
      # Offsets are committed by the listener container after each result is applied (at-least-once).
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # An orchestrator that dies without leaving the group is detected after this long; until then the
        # results on its partitions wait. Kafka's 45 s default stalled those runs for 45 s (docs/performance.md).
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: io.github.louaychayeb.flowforge.common.messaging.StepResult
        spring.json.use.type.headers: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    template:
      # Propagate the trace context in Kafka headers (W3C traceparent).
      observation-enabled: true
    listener:
      ack-mode: record
      observation-enabled: true
      concurrency: 3

server:
  port: 8080
  # Finish in-flight requests on SIGTERM (Kubernetes rolling updates).
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      # Lets one Prometheus tell orchestrator, worker and payment provider apart.
      application: ${spring.application.name}
  tracing:
    # Off unless a collector is there to receive spans (docker compose and the Helm chart switch it on).
    enabled: ${FLOWFORGE_TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${FLOWFORGE_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    enable:
      # The engine loops tick every few hundred milliseconds; tracing each tick would bury the traces that matter.
      tasks.scheduled: false
# Who may cancel runs, retry their compensation and deliver signals (see SecurityConfig). The default operator
# is for local demos only: set FLOWFORGE_OPERATOR_PASSWORD (a {bcrypt} hash in production) to change it.
flowforge:
  security:
    users:
      - name: ${FLOWFORGE_OPERATOR_NAME:operator}
        password: ${FLOWFORGE_OPERATOR_PASSWORD:flowforge}
        roles: [OPERATOR]
