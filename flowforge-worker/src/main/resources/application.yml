spring:
  application:
    name: flowforge-worker
  kafka:
    bootstrap-servers: ${FLOWFORGE_KAFKA_BOOTSTRAP:localhost:9092}
    # Shows up as the consumer's identity in Kafka (and in the dashboard): pod name on Kubernetes, host locally.
    client-id: flowforge-worker-${HOSTNAME:${COMPUTERNAME:local}}-${server.port}
    consumer:
      # All worker instances share one group, so each command is handled by exactly one of them.
      group-id: flowforge-workers
      # Offsets are committed by the listener container after each command is processed (at-least-once).
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # A worker that dies without leaving the group is detected after this long, and its partitions
        # (with any uncommitted commands) move to the remaining workers.
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: io.github.louaychayeb.flowforge.common.messaging.StepCommand
        spring.json.use.type.headers: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    template:
      # Propagate the trace context in Kafka headers (W3C traceparent).
      observation-enabled: true
    listener:
      ack-mode: record
      observation-enabled: true
      concurrency: 3

server:
  port: 8081
  # Finish in-flight requests on SIGTERM (Kubernetes rolling updates).
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      # Lets one Prometheus tell orchestrator, worker and payment provider apart.
      application: ${spring.application.name}
  tracing:
    # Off unless a collector is there to receive spans (docker compose and the Helm chart switch it on).
    enabled: ${FLOWFORGE_TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${FLOWFORGE_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    enable:
      # The engine loops tick every few hundred milliseconds; tracing each tick would bury the traces that matter.
      tasks.scheduled: false